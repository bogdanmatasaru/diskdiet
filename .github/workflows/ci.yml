name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install bats-core kcov gitleaks markdownlint-cli2 bash shellcheck mole

      - name: shellcheck
        run: shellcheck -s bash skills/diskdiet/scripts/*.sh tests/stubs/* tests/eval-stubs/mo tests/eval-stubs/brew evals/run.sh tests/*.bash tests/*.bats tests/smoke.sh .githooks/pre-commit

      - name: bats
        run: bats tests

      # mole_whitelist.bats runs the real Mole, which breaks under kcov's bash
      # tracing; the bats step above runs it uncovered.
      - name: kcov
        run: |
          ulimit -n 4096
          SCRIPT_BASH="$(brew --prefix)/bin/bash" kcov --bash-parser="$(brew --prefix)/bin/bash" \
            --include-path="$PWD/skills/diskdiet/scripts" coverage "$(command -v bats)" \
            $(ls tests/*.bats | grep -v mole_whitelist)
          /usr/bin/jq -r '.files[] | "\(.file | split("/") | last) \(.percent_covered)% \(.covered_lines)/\(.total_lines)"' \
            coverage/bats/coverage.json

      - name: gitleaks
        run: |
          gitleaks dir . --config .gitleaks.toml --redact --no-banner
          gitleaks git . --config .gitleaks.toml --redact --no-banner

      - name: markdownlint
        run: markdownlint-cli2 '**/*.md'
